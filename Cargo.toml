[package]
name = "vicr123-accounts"
version = "0.1.0"
edition = "2024"

[dependencies]
zbus = { version = "5", features = ["tokio"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
pbkdf2 = "0.13"
rand = "0.10"
base64 = "0.22"
sha1 = "0.11"
sha3 = "0.11"
regex = "1"
zvariant = "5"
chrono = "0.4"
hmac = "0.13"
jwt-simple = "0.12"
serde = "1"
serde_json = "1"
rust-embed = "8"
mail-send = "0.6"
async-trait = "0.1"
